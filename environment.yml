# Linux x86_64 bootstrap. Run setup-ml-base.sh for the ordered pip/native stages.
name: ml-base
channels:
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.16
  - pip=26.2.1
  - setuptools=78.1.0
  - wheel=0.48.0
  - packaging=26.3
  - cmake=4.4.3
  - ninja=1.13.2
  # Compiler and headers are needed to build Mamba for the selected PyTorch ABI.
  # No cuda-toolkit metapackage or Conda cuBLAS/cuDNN/torch packages.
  - cuda-nvcc=12.8.93
  - cuda-cudart-dev=12.8.90
  - cuda-cccl=12.8.90
